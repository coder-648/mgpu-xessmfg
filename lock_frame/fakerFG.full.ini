; ============================================================================
;  lock_frame fakerFG.full.ini —— 测试版（完整参数）
;
;  这是测试/调参模板；发布版默认用 fakerFG.ini（精简）。UI 里：
;    「高级设置 → 游戏侧配置 → 配置版本」选「完整（测试）」
;  会把本文件备份并覆盖到游戏目录的 fakerFG.ini；重启游戏生效。
;
;  输入源固定 DLSSG：本版只实现 Streamline tag 车道，写其他值会被强制回 DLSSG
;  （FgInput=NoFG 除外，用于显式禁用）。producer 每个会话只读一次。
; ============================================================================
[fakerFG]

; ---------------------------------------------------------------- 输入 / 进程
RealSwapchainObject=1
FgInput=DLSSG
; Capture = producer/consumer 链路（发布）；XeFG = 本机直出（仅验证用）
FgOutput=Capture
MvScaleMultiplyResolution=1
; 0 = 接管 swapchain；1 = 完全透传
Passthrough=0
Log=1
; 0 = MV/depth copy 走独立 copy queue；1 = 内联到标题 command list
CopyInline=0

; 个别标题的 tag lifecycle 是错的：1 = 该资源强制 ValidNow（在 Evaluate 的 list 上立刻拷）
FGDepthValidNow=0
FGVelocityValidNow=0
FGHudlessValidNow=0

; 相机兜底（游戏没给投影矩阵时）。0 = 不覆盖
CameraNear=0.1
CameraFar=100000
VerticalFov=60
; 非 0 时把 FG 矩形裁到该区域（0 = 全屏）
RectLeft=0
RectTop=0
RectWidth=0
RectHeight=0

; 这些由 FgInput 自动推导，写在这里只作记录（DLSSG 会覆盖）：
; StripDlssGPlugin=1
; FakeSlDlssg=1
; NgxCoreProxy=0
; ArchSpoof=1
; TagAtEvaluate=0

; 发布门控：首帧后延迟多少 ms 才建 transport（避免在游戏启动阶段初始化）
PublishDelayMs=1200
; 1 = 只记录不发布（拿 producer 日志，不建 transport）
NoPublish=0
PublishTrace=0

; ------------------------------------------------------------ MV/depth 传输
; 100=1:1，150=每维 2/3，200=每维 1/2，400=每维 1/4
StreamPercent=150
StreamPercentMv=150
StreamPercentDepth=150

; ------------------------------------------------------- v30 无损码流（fr）
; auto = 能跑就用，跑不了自动退回跨卡直接拷贝；1 = 强制开；0 = 强制关
MvCodec=auto
DepthCodec=auto
; 0/100 = 1:1；150 = 先降采样再编码（仅用于 A/B）
CodecStreamPercent=100
; 按流覆盖 CodecStreamPercent（0/缺省 = 跟随）
MvCodecPercent=100
DepthCodecPercent=150
; 1 = depth 先按 fp16 精度取整再无损编码（有损，默认 0）
DepthFp16=0

; v34: HUDless source. Auto = stable HUDLessColor snapshot (scene-referred).
; Scaling = experimental; CP2077's ScalingOutputColor has been invalid (green blocks).
; Hudless = force the scene-referred HUDLess snapshot.
HudlessSource=Auto

; --------------------------------------------------------------- UI 合成（默认开启，1.3.0+）
; 固定 mode 4：stream 4 = 支撑域 patch（HudlessStream）；stream 3 默认关闭。
; 有游戏 UI 也不再叠加 UI 平面 / mode 5；consumer 只 tag H'。
; UiPatch=0 回退旧路径；完全关闭请同时写 UiStream=0 + UiSource=Off + UiPatch=0 +
; HudlessStream=0。
; UiPatch=1 会强制全分辨率 / 码流 / R10；UiSource=Off 表示不发布 stream 3。
UiStream=0
;   Auto | Game | Hudless | Off（patch 路线只用 Off）
UiSource=Off
;   1 = 全分辨率（XeFG 要求 UI/HUDless/backbuffer 同尺寸）
UiFullRes=1
; UI 传输：auto|0|1（fr 码流；patch 模式强制 1）
UiCodec=1
; UI 共享环槽数；stream 3 关闭时只需要最小值
UiSlots=2
; 空 32x8 tile 走 mode=3（sparse）
UiSparseCodec=1
; 1 = RGBA8（8-bit alpha）；patch 模式强制 0（R10 PQ）
UiAlpha8=0
; v34 支撑补丁：producer 把「被 UI 遮挡的画面」写进 stream 4，sparse codec 只发有支撑的
; 32x8 tile；消费端合成 H' = present（支撑外）/ patch（支撑内），只 tag H' -> mode 4。
UiPatch=1
UiPatchWhiteNits=80
; 旧半分辨率路径的 UI 传输比例（仅 UiFullRes=0 时生效）
StreamPercentUi=100
; v34: stream 4 = 支撑域 patch（HudlessStream=0 时关闭）；UiPatch=0 + 1 仍是旧的
; 全帧干净 HUDless 回退。
HudlessStream=1
HudlessSlots=8

; ------------------------------------------------------- 旧路径兼容（patch 忽略）
; 1 = 在 PQ 解码后的线性 nits 里做 P-(1-a)H（旧路径）
UiLinear=1
; 1 = UI RGB 已预乘（旧路径）
UiPremultiplied=1
; 1 = 3x3 max 膨胀 P-H mask（AA 边缘覆盖）
UiDilate=0

; ------------------------------------------------------- 旧 A/B（默认全关）
; tag-time synth：patch 路径不执行
UiTagSynth=0
; HUDless 快照转 PQ：patch 路径不执行
UiSnapshotPQ=0
; 仅当编译期 gate 关闭时用于本地 A/B；1.3.0 默认 gate 已开，保持 0 即可
UiSynthesis=0

; --------------------------------------------------------- 诊断 / 剖析（默认关）
; 每个我们自己的 dispatch 打 GPU 时间戳，每秒一行 prof:
ProfGpu=0
; 编码器消融 0|1|2|3（写出的字节不可解码，只在短跑里用）
FrCodecAblate=0
; 1 = 把 synth 的 P/H/U 写成 BMP（游戏目录 ui_synth_dump）
UiSynthDump=0
UiSynthDumpAfter=30
; D3D12 debug layer（会大幅变慢）
D3dDebug=0
; FG 调试视图（tag 生成帧 / 只看生成帧等）
DebugView=0
DebugOnlyGenerated=0

; ------------------------------------------------------------- 内部/实验（勿动）
; 以下键只在特定 A/B 中使用，默认值即可。
TagBackbuffer=1
TagUi=0
; ForceBorderless / SkipFirstFrames 默认跟随游戏适配表；需要强制时再取消注释
; ForceBorderless=1
; SkipFirstFrames=30
SimulateWaitableObject=0
IgnoreInitChecks=0
NoOutputReal=0
; MvState/DepthState/ColorState 由游戏适配表推导，不要手写
