; ============================================================================
;  lock_frame fakerFG.ini —— 测试版（完整参数）
;
;  这是测试/调参模板；发布版用 fakerFG.ini（精简）。UI 里：
;    「高级设置 → 游戏侧配置 → 配置版本」选「完整（测试）」
;  会把本文件备份并覆盖到游戏目录的 fakerFG.ini；重启游戏生效。
;
;  输入源固定 DLSSG：本版只实现 Streamline tag 车道，写其他值会被强制回 DLSSG
;  （FgInput=NoFG 除外，用于显式禁用）。producer 每个会话只读一次。
; ============================================================================
[fakerFG]

; ---------------------------------------------------------------- 输入 / 进程
RealSwapchainObject=1
FgInput=DLSSG
; Capture = producer/consumer 链路（发布）；XeFG = 本机直出（仅验证用）
FgOutput=Capture
MvScaleMultiplyResolution=1
; 0 = 接管 swapchain；1 = 完全透传
Passthrough=0
Log=1
; 0 = MV/depth copy 走独立 copy queue；1 = 内联到标题 command list
CopyInline=0

; 个别标题的 tag lifecycle 是错的：1 = 该资源强制 ValidNow（在 Evaluate 的 list 上立刻拷）
FGDepthValidNow=0
FGVelocityValidNow=0
FGHudlessValidNow=0

; 相机兜底（游戏没给投影矩阵时）。0 = 不覆盖
CameraNear=0.1
CameraFar=100000
VerticalFov=60
; 非 0 时把 FG 矩形裁到该区域（0 = 全屏）
RectLeft=0
RectTop=0
RectWidth=0
RectHeight=0

; 这些由 FgInput 自动推导，写在这里只作记录（DLSSG 会覆盖）：
; StripDlssGPlugin=1
; FakeSlDlssg=1
; NgxCoreProxy=0
; ArchSpoof=1
; TagAtEvaluate=0

; 发布门控：首帧后延迟多少 ms 才建 transport（避免在游戏启动阶段初始化）
PublishDelayMs=1200
; 1 = 只记录不发布（拿 producer 日志，不建 transport）
NoPublish=0
PublishTrace=0

; ------------------------------------------------------------ MV/depth 传输
; 100=1:1，150=每维 2/3，200=每维 1/2，400=每维 1/4
StreamPercent=150
StreamPercentMv=150
StreamPercentDepth=150

; ------------------------------------------------------- v30 无损码流（fr）
; auto = 能跑就用，跑不了自动退回跨卡直接拷贝；1 = 强制开；0 = 强制关
MvCodec=auto
DepthCodec=auto
; 0/100 = 1:1；150 = 先降采样再编码（仅用于 A/B）
CodecStreamPercent=100
; 按流覆盖 CodecStreamPercent（0/缺省 = 跟随）
MvCodecPercent=100
DepthCodecPercent=150
; 1 = depth 先按 fp16 精度取整再无损编码（有损，默认 0）
DepthFp16=0

; --------------------------------------------------------------- UI 合成（实验性）
; 发布版默认关闭（UiStream=0 / UiSource=Off）；本测试模板默认开启，只用于 A/B。
; 已知问题：边缘/半透明 UI 仍可能出现拖影或伪影。
; XeFG 模式：mode 5（HUDless + UI）；--no-ui-mode5 回退 mode 4
;   1 = 发布 stream 3（UI）
UiStream=1
;   Auto | Game | Hudless | Off
UiSource=Auto
;   1 = 全分辨率（XeFG 要求 UI/HUDless/backbuffer 同尺寸）
UiFullRes=1
; UI 传输：auto|0|1（fr 码流）
UiCodec=auto
; UI 共享环槽数（4K 全分辨率单槽约 34 MB）
UiSlots=8
; 空 32x8 tile 走 mode=3（sparse）
UiSparseCodec=1
; 1 = 在 PQ 解码后的线性 nits 里做 P-(1-a)H
UiLinear=1
; 1 = UI RGB 已预乘
UiPremultiplied=1
; 1 = RGBA8（8-bit alpha）；0 = R10（2-bit alpha，格式跟随链缓冲）
UiAlpha8=1
; 1 = 3x3 max 膨胀 P-H mask（AA 边缘覆盖）
UiDilate=0
; 实验：tag-time synth / HUDless 快照转 PQ / 强制打开合成门
UiTagSynth=0
UiSnapshotPQ=0
UiSynthesis=0
; 旧半分辨率路径的 UI 传输比例（仅 UiFullRes=0 时生效）
StreamPercentUi=200

; ------------------------------------------- v32 干净 HUDless（stream 4）
; 1 = 直接传全分辨率 HUDless（R10 PQ），消费端不做 unblend（边缘无除法放大）
;      成本：4K 约 33 MB/帧 ≈ 1.33 GB/s @40fps；需要 consumer 加 --hudless-stream
HudlessStream=0
HudlessSlots=8

; --------------------------------------------------------- 诊断 / 剖析（默认关）
; 每个我们自己的 dispatch 打 GPU 时间戳，每秒一行 prof:
ProfGpu=0
; 编码器消融 0|1|2|3（写出的字节不可解码，只在短跑里用）
FrCodecAblate=0
; 1 = 把 synth 的 P/H/U 写成 BMP（游戏目录 ui_synth_dump）
UiSynthDump=0
UiSynthDumpAfter=30
; D3D12 debug layer（会大幅变慢）
D3dDebug=0
; FG 调试视图（tag 生成帧 / 只看生成帧等）
DebugView=0
DebugOnlyGenerated=0

; ------------------------------------------------------------- 内部/实验（勿动）
; 以下键只在特定 A/B 中使用，默认值即可。
TagBackbuffer=1
TagUi=0
; ForceBorderless / SkipFirstFrames 默认跟随游戏适配表；需要强制时再取消注释
; ForceBorderless=1
; SkipFirstFrames=30
SimulateWaitableObject=0
IgnoreInitChecks=0
NoOutputReal=0
; MvState/DepthState/ColorState 由游戏适配表推导，不要手写
