; ============================================================================
;  lock_frame fakerFG.ini —— 发布版（精简）
;
;  放在游戏 exe 旁边；producer 每个会话只读一次，改完要重启游戏。
;  输入源固定 DLSSG（Streamline tag）：本版不实现 NVNGX / Upscaler / FSR，
;  写了别的值也会被强制回 DLSSG（FgInput=NoFG 除外，用于显式禁用）。
;
;  需要实验参数时用 fakerFG.full.ini 覆盖本文件：
;    UI →「高级设置 → 游戏侧配置 → 配置版本」选「完整（测试）」
;
;  颜色由消费端 WGC 抓取；渲染卡只传 MV / depth / UI，不做颜色拷贝。
; ============================================================================
[fakerFG]
RealSwapchainObject=1

; 固定 DLSSG。FgOutput=Capture 是唯一发布模式（producer/consumer 链路）。
FgInput=DLSSG
FgOutput=Capture

; Streamline 的 mvecScale 是归一化系数（OptiScaler 的做法）。
MvScaleMultiplyResolution=1

; 0 = 接管 swapchain；1 = 完全透传（调试/禁用）。
Passthrough=0
Log=1

; MV/depth 跨卡传输比例：100=1:1，150=每维 2/3，200=每维 1/2。
StreamPercent=150
StreamPercentMv=150
StreamPercentDepth=150

; v30 无损码流：auto = 能跑就用，跑不了自动退回跨卡直接拷贝。
MvCodec=auto
DepthCodec=auto

; 码流分辨率：MV 永远 100%（比特精确）；depth 默认 150%（遮挡判断不敏感）。
CodecStreamPercent=100
MvCodecPercent=100
DepthCodecPercent=150

; ---------------------------------------------------------------------------
; UI 合成（实验性，发布默认关闭）
;   已知问题：边缘/半透明 UI 仍可能出现拖影或伪影，不建议日常开启。
;   UiStream=1 + UiSource=Auto：发布 UI 平面（插值帧的 HUD 不残影，渲染卡约 +0.8 ms/帧）
;   UiFullRes=1：全分辨率（XeFG 要求 UI/HUDless/backbuffer 同尺寸）
;   只用于 A/B；需要时把下面两行改成 1 / Auto 并重启游戏。
; ---------------------------------------------------------------------------
UiStream=0
UiSource=Off
UiFullRes=1
UiCodec=auto
UiSlots=8
UiSparseCodec=1
UiLinear=1
UiPremultiplied=1

; ---------------------------------------------------------------------------
; 诊断开关：发布包里必须保持 0（scripts/check_release.py 会校验）
; ---------------------------------------------------------------------------
ProfGpu=0
FrCodecAblate=0
DepthFp16=0
