; ============================================================================
;  lock_frame 版 fakerFG.ini
;
;  放在游戏 exe 旁边（producer 的 read_percent / ColourStream 都从这里读）。
;  默认配置：
;    ColourStream=0   颜色不跨卡，消费者用 WGC 抓（省渲染卡约 6%）
;    StreamPercent=150  MV/depth 每个维度 2/3（字节 4/9），把带宽留给渲染卡
;
;  1 = 开, 0 = 关。修改后重开游戏生效（producer 每个会话只读一次）。
; ============================================================================
[fakerFG]
RealSwapchainObject=1
; 输入源是唯一需要选择的参数。其他开关由它自动推导，不要在这里暴露。
;   FgInput=DLSSG  Streamline slSetTag / slEvaluateFeature(DLSS_G)（推荐）
;   FgInput=NVNGX  NVSDK_NGX_DLSSG 参数块（游戏自己 evaluate DLSS-G 的标题）
;   FgInput=Upscaler  DLSS-SR 参数块（FGInput=Upscaler，link 模式）
;   FgInput=FSR    暂未实现（fakerFG 里没有 ffx hook；写它等于 NoFG）
FgInput=DLSSG
; FgOutput 通常不用写：FgInput 会自动落到 Capture（producer/consumer 链路）。
; 需要在本机验证 XeFG 时再显式写 FgOutput=XeFG。
FgOutput=Capture
; Streamline 的 mvecScale 是"归一化"系数；1 = 乘 MV 分辨率得到 XeFG 要的 texel->pixel
; 系数（OptiScaler 的做法）。0 = 原样透传（标题已给像素单位时用）。仅 DLSSG 车道相关。
MvScaleMultiplyResolution=1
; 个别标题的 tag lifecycle 是错的：1 = 该资源强制 ValidNow（在 Evaluate 的命令表上立刻拷）。
FGDepthValidNow=0
FGVelocityValidNow=0
FGHudlessValidNow=0
; 输入帧率由游戏自身/显示链决定；fakerFG 不再限制它。
; 1 = 不接管 swap chain / 不回答 FG，交给真实运行时（A/B 或禁用）。
Passthrough=0
Log=1
ColourStream=0
; 0 = MV/depth copy 走独立 copy queue（默认，避免把渲染卡常时间占满）
; 1 = copy 内联到游戏 command list（满载时降低 post-present 等待的 A/B 选项）
CopyInline=0
StreamPercent=150
StreamPercentMv=150
StreamPercentDepth=150
; ---------------------------------------------------------------------------
; UI 合成 / Hudless discovery 已暂停（保留配置位，全部关闭）
; UI_SYNTHESIS_GATE=CLOSED：只有游戏默认、每帧都提供有效 UI 流时才允许重开。
;   UiStream=0：不发送 stream 3；UiSource=Off：不使用任何 UI/HUDless 合成源。
; 恢复前不要再打开这些开关。
; ---------------------------------------------------------------------------
UiStream=0
UiSource=Off
StreamPercentUi=200
UiPremultiplied=1

; ---------------------------------------------------------------------------
; v30 无损传输（1.2.3 起的默认路径，docs/design/LOSSLESS_TRANSPORT.md）
;
;   auto = 这台机器能跑就用码流，跑不了自动退回"跨卡直接拷贝 + 升降采样"的老路径。
;          探测发生在启动时（PSO/缓冲能否创建、格式是否被内核支持），不满足就只用老路径，
;          并在 producer 日志里写一行 fr: codec capability: ...
;   1    = 强制开（格式/硬件不满足时该流会被丢弃，仅用于验证）
;   0    = 强制关（等价于 1.2.2 的行为）
;
;   码流流会被强制成 StreamPercent=100（无损必须 1:1），所以上面的 150 只对老路径有效。
;   两条流互相独立：MvCodec=auto + DepthCodec=0 这类混合档也是合法的。
;   游戏在不同 DLSS 档位下给的 MV/depth 尺寸可能不同，消费端会自动重采样到同一尺寸再 tag。
MvCodec=auto
DepthCodec=auto
