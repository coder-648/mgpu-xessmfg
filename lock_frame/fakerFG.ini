; ============================================================================
;  lock_frame fakerFG.ini —— 发布版（精简）
;
;  放在游戏 exe 旁边；producer 每个会话只读一次，改完要重启游戏。
;  输入源固定 DLSSG（Streamline tag）：本版不实现 NVNGX / Upscaler / FSR，
;  写了别的值也会被强制回 DLSSG（FgInput=NoFG 除外，用于显式禁用）。
;
;  需要实验参数时用 fakerFG.full.ini 覆盖本文件：
;    UI →「高级设置 → 游戏侧配置 → 配置版本」选「完整（测试）」
;
;  颜色由消费端 WGC 抓取；渲染卡只传 MV / depth / UI，不做颜色拷贝。
; ============================================================================
[fakerFG]
RealSwapchainObject=1

; 固定 DLSSG。FgOutput=Capture 是唯一发布模式（producer/consumer 链路）。
FgInput=DLSSG
FgOutput=Capture

; Streamline 的 mvecScale 是归一化系数（OptiScaler 的做法）。
MvScaleMultiplyResolution=1

; 0 = 接管 swapchain；1 = 完全透传（调试/禁用）。
Passthrough=0
Log=1

; MV/depth 跨卡传输比例：100=1:1，150=每维 2/3（默认），200=每维 1/2。
StreamPercent=150
StreamPercentMv=150
StreamPercentDepth=150

; 发布环深度（J，2026-11-25）。frames[]/consumed[] 在协议里仍是 32 项，但只发布/放置
; 前 N 个：4K codec 每槽约 33 MiB，32 槽会预留 ~1.7 GiB 的跨卡映射；16 槽约减半，
; 仍覆盖实测 colour lag（最大 13）。范围 4..32；出现 pair no_slot 时再往上加。
TransportSlots=16

; v30 无损码流：auto = 能跑就用，跑不了自动退回跨卡直接拷贝。
MvCodec=auto
DepthCodec=auto

; 码流分辨率：MV 永远 100%（比特精确）；depth 默认 150%（遮挡判断不敏感）。
CodecStreamPercent=100
MvCodecPercent=100
DepthCodecPercent=150

; v34: HUDless source. Auto = stable HUDLessColor snapshot (scene-referred).
; Scaling = experimental: use Streamline ScalingOutputColor as patch colour; CP2077's
; scaling output has been invalid (green blocks), so it is NOT the default.
; Hudless = force the scene-referred HUDLess snapshot.
HudlessSource=Auto

; ---------------------------------------------------------------------------
; UI 合成（默认开启，1.3.0+）
;   固定为 mode 4 路线：
;     P/H 差分 -> 只把「被 UI 遮挡的画面」的支撑域 patch 写入 stream 4
;     -> consumer 重建干净 HUDless -> 只 tag H'，XeFG 走 mode 4。
;   stream 3（游戏 UI 平面）和 mode 5 默认关闭：多一次 UI 编码/解码，
;   在渲染卡上的收益不高。
;   UiPatch=1 会强制 UiFullRes=1 / UiCodec=1 / UiSparseCodec=1 / UiAlpha8=0；
;   UiStream=0 + UiSource=Off 表示不发布 stream 3。
;
;   完全关闭：UiStream=0 + UiSource=Off + UiPatch=0 + HudlessStream=0。
; ---------------------------------------------------------------------------
UiStream=0
UiSource=Off
UiFullRes=1
UiCodec=1
UiSlots=2
UiSparseCodec=1
UiAlpha8=0
UiPatch=1
UiPatchWhiteNits=80
StreamPercentUi=100
HudlessStream=1

; 旧路径兼容键（patch 模式忽略；保留给 UiPatch=0 的 A/B 回退）
UiLinear=1
UiPremultiplied=1
UiDilate=0
; P/H 差分支撑阈值（1/255 码值，默认 2）。patch 覆盖面的旋钮：调高则 UI 的
; AA/淡边留在 present 里（H' 残留一点 UI，mode 4 会把那条边当场景插值），调低则
; 支撑区白涨字节。实测：8 会漏掉小 UI 的软边（移动时抖），2 明显更好；
; 干净像素的 P/H 残差约 0.012 码值（≈3/255），所以 2 会把少量噪声也收进支撑——
; 视觉无害（patch 就是场景），只多一点码流。
UiSynthThreshold=2
; synth 覆盖率/诊断计数器每隔多少帧写一次（0=从不，1=每帧）。它们是逐像素
; InterlockedAdd，4K 下每帧几十万次；读数只按 1 Hz 记录，所以默认每 60 帧。
UiStats=60

; ---------------------------------------------------------------------------
; 诊断开关：发布包里必须保持 0（scripts/check_release.py 会校验）
; ---------------------------------------------------------------------------
ProfGpu=0
FrCodecAblate=0
DepthFp16=0
