; ============================================================================
;  lock_frame 版 fakerFG.ini
;
;  放在游戏 exe 旁边（producer 的 read_percent / ColourStream 都从这里读）。
;  这一版的关键预算：
;    ColourStream=0   颜色不跨卡，消费者用 WGC 抓（省渲染卡约 6%）
;    StreamPercent=150  MV/depth 每个维度 2/3（字节 4/9），把带宽留给渲染卡
;
;  1 = 开, 0 = 关。修改后重开游戏生效（producer 每个会话只读一次）。
; ============================================================================
[fakerFG]
; 输入源是唯一需要选择的参数。其他开关由它自动推导，不要在这里暴露。
;   FgInput=FSR    FSR 3.1 FFX FrameGenerationPrepare
;   FgInput=DLSSG  Streamline slSetTag / slEvaluateFeature(DLSS_G)
;   FgInput=NVNGX  NVSDK_NGX_DLSSG 参数块
;   FgInput=Upscaler  legacy DLSS-SR 参数块
FgInput=DLSSG
; FgOutput 通常不用写：FgInput 会自动落到 Capture（producer/consumer 链路）。
; 需要在本机验证 XeFG 时再显式写 FgOutput=XeFG。
;FgOutput=Capture
; 限制 fakerFG 看到的原生输入帧率已移除；帧率由游戏自身/显示链决定。
; 1 = 不接管 swap chain / 不回答 FG，交给真实运行时（A/B 或禁用）。
Passthrough=0
Log=1
ColourStream=0
; 0 = MV/depth copy 走独立 copy queue（默认，避免把渲染卡常时间占满）
; 1 = copy 内联到游戏 command list（满载时降低 post-present 等待的 A/B 选项）
CopyInline=0
StreamPercent=150
StreamPercentMv=150
StreamPercentDepth=150
