; fakerFG.ini - fakerFG.dll (deployed as dxgi.dll + nvngx_dlssg.dll)
; Read once at start. Every key here is a decision about the FG pipeline, not
; about the capture (that one is game_capture.ini).
[fakerFG]

; 1 = passthrough to the real runtime (replaces the old off/observe modes).
; 0 = fakerFG owns the FG path; FgOutput selects local XeFG or Capture.
Passthrough=0
; [measurement] Publish=1
; [capture] StreamPercent: cross-adapter stream size as a percentage of the render size.
;   150 = ~2/3 (default; 4K -> 2560x1440, 28.1 MB/frame instead of 63.3). 100 = 1:1,
;   200 = 1/2, 400 = 1/4. MV+depth are scaled by one compute pass before the copy.
;   Needs a DIRECT/COMPUTE command list; a COPY-only list automatically falls back to 1:1
;   for the rest of the session (log: "falling back to StreamPercent=100") instead of
;   publishing nothing.
;   Cost reference: 4K 1:1 = 63.3 MB/frame (~4.8 ms); 150 = 28.1 MB (~1.2-2.2 ms).
StreamPercent=200
StreamPercentMv=200
StreamPercentDepth=200
ColourStream=0
; Per-stream override (protocol v15). Default = StreamPercent above. The bridge can also
; override these at runtime (--stream-asym / --stream-auto); a non-zero request wins
; while the bridge is running. StreamPercentMv=100 + StreamPercentDepth=200 is the
; "full-resolution MV, half-resolution depth" mode (needs --upsample in the bridge).
; StreamPercentMv=100
; StreamPercentDepth=200
 (default) / 0. 0 = publish nothing at all: no record snapshot,
; no sink call, no transport work (the producer receives no frame). Use it to measure what
; the publish path costs on the render thread:
;   Publish=0 -> baseline, Publish=1 -> with transport. Not for normal play.
; (the old negative key NoPublish=1 is still accepted; Publish wins when both are set)
Publish=1


; Generated frames per real frame, local mode only. 1 = 2x. The DLL's own
; maximum is printed at startup ("maxSupportedInterpolations"), values above it
; are clamped (use the bridge's --unlock-mfg for 3x+).
Interpolated=1

; 1 = load ReShade64.dll from the game folder. Not needed any more (the producer replaced
; the ReShade add-on); only set it when you want other ReShade shaders on top.
InjectReshade=0

; 1 = take the swap chain over (XeFG creates it and presents). This is what makes
; "no game-side generation, correct picture" possible; 0 = observe only.
OwnSwapchain=1

; 1 = hand the title the swap chain libxess created and detour its vtable, exactly like
; OptiScaler's FGHooks::HookFGSwapchain (Present 8, SetFullscreenState 10, GetFullscreenState 11,
; ResizeBuffers 13, ResizeTarget 14, GetFullscreenDesc 19, Present1 22, Waitable 33, RB1 39).
; 0 = our own facade object. Same behaviour, different object identity.
RealSwapchainObject=1

; 1 = answer the DLSS-G CreateFeature with our own handle, so the title enters its FG mode and
; hands us every input (MV/depth/hudless/UI/OutputReal/OutputInterpolated). That is the input
; capture mode. 0 = decline it, like OptiScaler when it has no real DLSS-G provider
; (Nvngx_FG::D3D12_CreateFeature forwards and answers Fail): the title then keeps its own FG
; off and renders the whole frame into the swap chain we handed it - which is what lets XeFG
; interpolate it with no copy and no second presenter.
FakeDlssgFeature=1

; 1 = provider mode: write the contract's OutputReal from DLSSG.Backbuffer each Evaluate, on
; the title's own command list. Use with OwnSwapchain=0 when nothing generates.
WriteOutputReal=1

; 1 = never answer, never take over - the escape hatch for a bad session.
Passthrough=0

; The architecture answer Streamline asks before slInit. 1 = claim Ada for the
; Streamline caller only (RTX 20/30 needs this to be offered DLSS-G at all).
; 0 = honest answer (30-series then shows no Frame Generation entry).
ArchSpoof=1

; What the XeFG swap chain is told about the inputs. CP2077 is reversed-Z;
; DepthInverted=1 is also right for UE5 and RE Engine. MvJittered=1 tells XeFG to
; take the frame's jitter back out of the velocity (UE5 titles declare it).
DepthInverted=1
MvJittered=0
HighResMv=0

; parameter block ("DLSSG.Backbuffer") and only draw the UI into the swap chain
; (Wuchang) need that frame copied into the chain buffer before Present, or the
; picture is black while the present status looks healthy.
; 0 = copy at present (measured stable), 1 = copy inside the DLSS-G Evaluate
; (OptiScaler HudCopy placement; flickered on Wuchang).
; MvResample: titles that hand the upscaler full-resolution motion vectors (DLSS create
; flags without MVLowRes, MV resource at the output size) get them resampled onto the
; depth's size, with the vectors scaled to render pixels. After the pass the input really
; is low-res MV, so the activation gate applies unchanged and no size is faked.
MvResample=1

; ---- OptiScaler's present/evaluate shader passes, same names and defaults ----
; FGDrawUIOverFG: draw the title's UI texture over the chain buffer right before Present
; (RUI_Dx12). Needs FgInput=DLSSG (the UI resource only exists in that block).
FGDrawUIOverFG=0
; UI alpha convention: 1 = premultiplied (OptiScaler default), 0 = straight alpha.
FGUIPremultipliedAlpha=1
; FGHudCutoff: 0 = off. 1..10 blends that much of the hudless into the frame the title
; declared (HudCopy_Dx12), on the title's own command list inside the DLSS-G Evaluate.
FGHudCutoff=0
; FGHudlessCompare: diagnostic, paints pink where hudless and the frame disagree.
FGHudlessCompare=0

; Colour: by default XeFG uses its own backbuffer, which already contains the UI.
; TagHudless/TagUi are the higher-quality path (UI interpolated separately) but
; need the right premultiply convention - turn them on per title, one at a time.
; With FgInput=Upscaler neither is sent at all (OptiScaler's Upscaler_Inputs_Dx12 only
; hands a colour over when FGHUDFix is on, and skips the backbuffer tag for this lane -
; XeFG_Dx12.cpp:945); the keys only matter for the DLSSG lane.
TagBackbuffer=1
TagHudless=0
TagUi=0

; 1 = tag MV/depth inside the upscaler's own Evaluate (the title's command list is still
; OPEN there, so ValidNow is legal) and let the present path send only the frame constants
; and the present id - OptiScaler's Upscaler_Inputs_Dx12 placement. Only used with
; FgInput=Upscaler. 0 = tag from the present path with UntilPresent (the already verified
; behaviour).
TagAtEvaluate=0

; 1 = the UI texture is already premultiplied. 0 (OptiScaler's default,
; FGUIPremultipliedAlpha=false) sets XEFG_SWAPCHAIN_INIT_FLAG_UITEXTURE_NOT_PREMUL_ALPHA.
; Only matters when TagUi=1.
UiPremultiplied=0

; 1 = keep Streamline's real sl.dlss_g plugin out; the game is then expected to call
; slEvaluateFeature itself (we answer it). 0 = let it load - CP2077 needs this, because
; its FG is driven by that plugin, which calls our NGX provider. Stripping it on CP2077
; leaves the game "on" with nothing generating (native picture).
StripDlssGPlugin=0

; 1 = answer slDLSSGSetOptions / slDLSSGGetState ourselves and keep the game away from
; the real sl.dlss_g plugin. 0 = forward them, which is what CP2077 needs: it tells the
; plugin to start, the plugin loads our nvngx_dlssg.dll and calls NGX - and that call is
; where we harvest and tag XeFG. (OptiScaler also only fakes the gate, not the functions.)
FakeSlDlssg=0

; 1 = impersonate the driver's NGX core (answer LoadLibrary/GetModuleHandle/LdrLoadDll for
; nvngx.dll / _nvngx.dll with our own module, forwards the rest to the real core).
; LEAVE AT 0: OptiScaler never does this. It only ever exists as `nvngx_dlssg.dll` - the
; DLSS-G *feature* module - and lets DLSS-SR keep the driver's real core. Impersonating the
; core is what makes CP2077 drop the DLSS option from its video menu (the DLSS runtime
; resolves its entry points from a module that is not the real core), which then also
; leaves `FgInput=Upscaler` without any upscaler Evaluate to harvest.
NgxCoreProxy=0

; RETIRED: the depth copy is always recorded inline on the frame's command list now
; (OptiScaler's ValidButMakeCopy shape - its XeFG path has no present-time pass). Leave
; at 0; the key is only kept so old ini files keep loading.

; The resource state we DECLARE for the motion vectors and for the depth (hex or
; decimal). OptiScaler's [Hotfix] MotionVectorResourceBarrier / DepthResourceBarrier
; equivalents.
;   64 = D3D12_RESOURCE_STATE_NON_PIXEL_SHADER_RESOURCE (their default for both)
;  128 = PIXEL_SHADER_RESOURCE   192 = both   16 = COPY_SOURCE   4 = COPY_DEST
; A wrong value here is not cosmetic: the barrier's StateBefore must match the real
; state bit for bit, or the GPU hangs and every present afterwards waits for a removed
; device. The log prints which value was used ("StateBefore=0x..").
; DLSS-G block declares D32_FLOAT(39), and XeFG 1.3.1 answers -12 MISMATCH_INPUT_RESOURCES
; at present time when it is handed D32 (measured; tag-time validation passes, so the
; error only shows up as "generation ON" followed by a rejection).
; 0 = tag the title's depth as-is - valid only when it already is R32 (the upscaler lane:
; NgxCoreProxy=1 and a title whose DLSS-SR depth is R32, which is the only case OptiScaler
; ever runs without a copy).

; 1 = open <exe>_fakerFG.log (flushed per line). Turn off only for final runs.
Log=1

; OptiScaler FGXeFGDebugView: 1 = mark interpolated frames on screen (verifies FG fast).
DebugView=0

; OptiScaler FGRectLeft / FGRectTop / FGRectWidth / FGRectHeight: the interpolation rect
; inside XeFG's backbuffer. 0 = the whole backbuffer, which is the normal case; only used
; when the inputs do NOT come from the upscaler (Upscaler lane skips the backbuffer tag).
RectLeft=0
RectTop=0
RectWidth=0
RectHeight=0

; OptiScaler SHOW_ONLY_INTERPOLATION (state.fgOnlyGenerated): 1 = only the generated frames
; are shown - the strongest check that XeFG generates at all.
DebugOnlyGenerated=0

; ---- OptiScaler [FrameGen] FGInput / FGOutput -------------------------------
; ONE input lane and ONE output, chosen explicitly - OptiScaler has no automatic
; lane. Same codes, same validation ("an FG Input without an FG Output, using none").
;   FgInput:  NoFG (default) | Upscaler | DLSSG | NVNGX | FSR
;   FgOutput: NoFG (default) | XeFG | Capture
; XeFG output on CP2077 needs FgInput=Upscaler: its DLSS-G block declares a D32 depth
; and XeFG 1.3.1 answers -12 for it (measured); the upscaler's depth is R32.
FgInput=DLSSG
FgOutput=XeFG

; OptiScaler FGXeFGIgnoreInitChecks
IgnoreInitChecks=0

; UpscalerInputs::GetCameraValues - the Upscaler input lane builds the projection from
; these (OptiScaler's FsrCameraNear / FsrCameraFar / FsrVerticalFov), NOT from the title.
CameraNear=0.1
CameraFar=100000
VerticalFov=60

; OptiScaler [Hotfix] MotionVectorResourceBarrier / DepthResourceBarrier (Upscaler lane).
; 0 = their default = 64 = D3D12_RESOURCE_STATE_NON_PIXEL_SHADER_RESOURCE.
MvState=0
DepthState=0

; 1 = never let the title take the chain into exclusive fullscreen: swallow
; SetFullscreenState(TRUE), make the window borderless, and still report fullscreen to the
; title (OptiScaler FGXeFGForceBorderless). XeFG refuses to interpolate otherwise:
;   SetFullscreenState called to set fullscreen mode. Interpolation is not supported in
;   fullscreen mode. / Interpolation won't be enabled.
; (measured on Wuchang, which switches to fullscreen when gameplay starts).
ForceBorderless=1

CopyInline=0
