[capture]
; v10: SlotPolicy=0 槽位没空闲就丢这一帧（实时默认）；=1 则最多等 SlotWaitUs 微秒
SlotPolicy=0
SlotWaitUs=2000
; OffloadQueue=1: MV/深度的**跨卡拷贝**改用 add-on 自己的一条命令队列（建在游戏的 device 上），
;   不再挂在游戏自己的 command list 里 —— 那 28-63 MB/帧的写出原来夹在"游戏最后一笔绘制 → Present"
;   之间（实测渲染卡 ~3.6 ms/帧，4K），是帧晚到/掉帧的直接来源之一（PERF_BASELINE 3.3 / 3.26）。
;   转换 pass 仍留在游戏 list（它的输入是游戏的资源）；只有我们自己的 RT 与共享槽移动，
;   所以不与游戏资源做跨队列状态交接。失败模式是设备复位 ⇒ **默认 0，必须开一场实测验收**。
;   日志：add-on 的 stats 行会多出 offload=<帧数> stalls=<CPU 等待次数> fail=<回退次数>
OffloadQueue=0
; 日志默认关：正常玩不写任何文件。要排查时把 Log 改成 1（或设环境变量
; MGPU_CAPTURE_LOG=1），会在 add-on 旁边生成 game_capture.log
Log=0

; Color=0: 不做 5K 颜色拷贝（颜色由 bridge 的 WGC 捕获），省 GPU
; Color=1: 恢复从游戏后台缓冲拷贝
;   实测代价（M4.2a，5K）：56 MB/帧 的额外跨卡写，且发生在游戏自己的 command list 上
;   → 游戏 GPU 占用 ~80% → ~95%（余量从 20% 掉到 5%，峰值场景会掉帧）
;   → 另外：bridge 当前只从 WGC 取颜色，不读这条颜色流，所以现在开 1 是纯成本零收益
Color=0

; ---- 跨卡流的尺寸（MV + 深度），两个键一起决定 ----
; StreamHeight: 流的高度上限，宽度按渲染宽高比算（取偶）。默认 1440 → 4K 游戏传 2560x1440。
;   0    = 不限制，跟随渲染尺寸（旧行为，4K 下 63 MB/帧）
;   1080 = 再降一档（4K 下 16 MB/帧，运动边界开始露馅，先别急着用）
;   2160 = 恢复全分辨率
; 为什么要降：这两个流是在渲染卡上产生的两个全屏 pass + 跨卡 DMA，4K 全分辨率是
;   63 MB/帧（40fps 下 2.6 GB/s）。降到 1440p 后 28 MB/帧，实测画质几乎无感
;   （docs/findings/FINAL_CONFIG.md 5.17.2、HANDOFF 8-27/8-28）。
StreamHeight=1440

; StreamPercent>100: 在上面基础上再按比例缩小（相对渲染尺寸算，150 = 渲染的 2/3）
; 100 = 只用 StreamHeight 决定的尺寸（默认）
StreamPercent=100

; SkipMv=0: 由 bridge/UI 决定要不要 MV 流（协议 v7 的请求位）
;          设 1 = 永远不产出。
;          实测（2026-11-08）：XeSS-FG 确实消费 MV，但 3x/4x 用游戏 MV 会闪、
;          且渲染卡要多花 ~7.4 ms；所以 3x 推荐用光流（bridge --fg-of），
;          2x 用游戏 MV 画质最好。细则见 docs/findings/QUALITY_VARIABLES.md
SkipMv=0

; LoaderHook=1（默认）：钩住 kernel32!LoadLibrary*，游戏一加载 nvngx / amd_fidelityfx / libxess 就立刻发现。
; LoaderHook=0：不碰游戏的加载器，改为每 120 帧扫一次模块表（发现晚一点）。
;   如果某个游戏"装上 add-on 后加载变慢"，先把它设 0 对照
;   （docs/findings/RE_ENGINE_NOTES.md §6）。
LoaderHook=1

; Input=auto: 输入源由 add-on 自动选（游戏真的加载了哪个超分库）
;   auto  = 谁先给出数据就用谁（默认）
;   ngx   = DLSS（NVIDIA），ffx = FSR（任意卡），xess = XeSS（任意卡）
;   depth = 没有超分时只用 ReShade 深度（bridge 侧需要开光流补 MV）
Input=auto

; 若某游戏上报的渲染分辨率不对，可在这里强制（>=256 才生效）
; RenderWidth=2560
; RenderHeight=1440
