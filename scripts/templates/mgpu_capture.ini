; ===========================================================================
;  mgpu_capture.ini - game-side capture (mgpu_capture.dll)
;  改完需要【重启游戏】才生效：这些键在 DLL 初始化时读一次，运行中不再读文件。
;  整数键只用数字；注释行以 ; 开头（不要写在值后面）。
;  游戏目录: <游戏>\bin\x64\mgpu_capture.ini
; ===========================================================================
[capture]

; ---------------------------------------------------------------------------
; 日志
; ---------------------------------------------------------------------------
; Log  1 = 写 mgpu_capture.log（同目录，追加写）；0 = 完全不产生日志。
;      排查问题必须开；正常游玩可关。默认 0。
Log=1

; ---------------------------------------------------------------------------
; 颜色 / UI 流
; ---------------------------------------------------------------------------
; Color  1 = 把颜色(含 HUDless)传到副卡；0 = 不传，副卡用 WGC 抓屏免费拿。
;        实测 4K 颜色 = 31.6 MB/帧 = 约 2 fps，所以默认不传。默认 1。
Color=0
; ColorFormat  颜色槽位的格式（DXGI 枚举值）。0 = R10G10B10A2_UNORM（SDR）。
;              27 = R11G11B10_FLOAT（HDR，游戏输出 HDR 时必须用它，否则格式不匹配会跳过该流）。
ColorFormat=27
; Ui  1 = 额外传 UI 颜色+alpha（副卡合成 UI 用）；0 = 不传。CP2077 不 tag UI，开着也没数据。
Ui=0
; UiFormat  UI 槽位格式（DXGI 枚举值）。0 = 跟随 ColorFormat 的约定。
UiFormat=0

; ---------------------------------------------------------------------------
; 数据来源
; ---------------------------------------------------------------------------
; Input  数据源选择。auto = 按已加载的模块自动挑（Streamline / NGX / 相机矩阵）。
Input=auto
; SlInput  1 = 走 Streamline 通道抓 MV/depth/HUDless（OptiScaler 模型：tag 带来资源和命令表）；
;          0 = 不用 Streamline，只靠 NGX 参数块/相机矩阵。CP2077 必须 1。默认 0。
SlInput=1
; StreamlineCamera  1 = 从 Streamline 的常量里取投影/相机矩阵（比自算准）。
StreamlineCamera=1
; FgSniff  1 = 挂钩 DLSS-G 的 EvaluateFeature/参数块，用来拿 MV/depth 和运行状态。默认 0。
FgSniff=1
; FgNgxHooks  1 = 同时挂 nvngx_dlssg.dll 的导出函数；0 = 只挂 Streamline。
;             如果游戏通过 enabler 走别的入口，设 0。默认 1。
FgNgxHooks=1
; FgCut  位掩码，切断游戏自己的帧生成（我们接管）：1=FSR-FG, 2=Streamline DLSS-G,
;        4=NGX DLSS-G, 7=全部。6 = 切断 DLSS-G 的两条路径，保留 FSR 不动。默认 0。
FgCut=6
; FollowConsumer  1 = 只传副卡当前请求的流；0 = 全部传（推荐：产者不依赖消费者状态）。默认 0。
FollowConsumer=0

; ---------------------------------------------------------------------------
; 流内容 / 尺寸（性能的主要旋钮）
; ---------------------------------------------------------------------------
; StreamPercent  MV/depth 传输尺寸。100 = 全尺寸；200 = 每维 1/2（像素 1/4，1920x1080）；
;                400 = 每维 1/4；800 = 每维 1/8。
;                实测成本 ≈ 字节 / 13 GB/s：4K 每条流 31.6 MB ≈ 2 fps，1/2 后每条 7.9 MB ≈ 0.5 fps。
;                降采样在主卡上用一个全屏 pass 完成（拷贝引擎不能缩放）。
StreamPercent=200
; SkipDepth  1 = 完全不产 depth 流；0 = 产。副卡做深度相关遮挡处理时需要它。默认 0。
SkipDepth=0
; SkipMv  1 = 完全不产 MV 流；0 = 产。默认 1（某些 FG 库不吃 tag 的 MV）。CP2077 用 0。
SkipMv=0
; DepthConvert  1 = 用 shader pass 把游戏的各种 depth 格式统一转成 R32 并缩放到 MV 尺寸；
;               0 = 关闭（深度会被跳过）。默认 1。
DepthConvert=1
; DepthDirect  1 = 直接对游戏的 depth-stencil 采样，省掉一次整幅拷贝；0 = 先进 typeless 中转。默认 1。
DepthDirect=1
; RenderWidth / RenderHeight  覆盖 MV/depth 的基准尺寸；0 = 用游戏实际上报的渲染尺寸（推荐）。
RenderWidth=0
RenderHeight=0

; ---------------------------------------------------------------------------
; MV 语义
; ---------------------------------------------------------------------------
; MvNormalize  0 = 原样透传（推荐，副卡自己按像素/UV 处理）；
;              1 = 除以渲染尺寸（像素→UV）；2 = 除以输出尺寸；auto = 按源的声明推导；
;              3 = 固定 0.5。默认 0。
MvNormalize=0
; MvFlip  1 = Y 方向取反。默认 0。
MvFlip=0
; MvFromUav  1 = 允许读取游戏留在 UNORDERED_ACCESS 状态的资源（可能让设备被移除，谨慎）。默认 0。
MvFromUav=1

; ---------------------------------------------------------------------------
; 挂钩范围
; ---------------------------------------------------------------------------
; LoaderHook  1 = 挂钩 LoadLibraryExW 以便发现后加载的模块（NGX/Streamline 常在游戏启动后才加载）。默认 1。
LoaderHook=1

; ---------------------------------------------------------------------------
; 资源状态 / 拷贝路径
; ---------------------------------------------------------------------------
; NoTransitions  1 = 不发任何 ResourceBarrier（危险，仅用于对照实验）。默认 0。
NoTransitions=0
; SubmitPathCopy  1 = 允许在提交阶段再做一次拷贝（会和抓取路径重复，通常关闭）。默认 0。
SubmitPathCopy=0
; OffloadQueue  1 = 把跨卡拷贝放到我们自己的 COPY 队列上（目前只用于实验路径）。默认 0。
OffloadQueue=0

; ---------------------------------------------------------------------------
; 测量开关（正常游玩全部保持默认值）
; ---------------------------------------------------------------------------
; PublishOff  1 = 记录但不发布（副卡拿不到帧），用于分离"发布/消费者"的成本。默认 0。
PublishOff=0
; NoCopies  1 = 一个字节都不拷（钩子和 tag 解析照常），用于测"拷贝本身"的成本。默认 0。
NoCopies=0
; CopyAtFrameEnd  1 = 拷贝改到帧末、我们自己的命令表/COPY 队列上，而不是插在游戏的命令表中间。
;                 注意：往游戏的图形队列追加命令表会让 CP2077 在第 2 次提交崩溃，已废弃；
;                 现在这条路径只走独立 COPY 队列。默认 0（内联）。
CopyAtFrameEnd=0
; TransferEveryN  每 N 帧才拷一次（1 = 每帧）。实测对帧率无影响，仅作对照实验。默认 1。
TransferEveryN=1

; ---------------------------------------------------------------------------
; FG 输入时序（OptiScaler 模型：资源"仅在当下有效"时立即拷）
; ---------------------------------------------------------------------------
; FGVelocityValidNow / FGDepthValidNow / FGHudlessValidNow
;   1 = 该流在 tag 声明 validUntilPresent 时立即拷贝（推荐）；0 = 等下一帧再拷。默认均为 1。
FGVelocityValidNow=1
FGDepthValidNow=1
FGHudlessValidNow=1

; ---------------------------------------------------------------------------
; 其它（默认值即可，除非要调试）
; ---------------------------------------------------------------------------
; SlFgOff  1 = 主动关掉游戏的 DLSS-G（不切管线，只让运行时收手）。默认 0。
SlFgOff=0
; Claim  1 = 采集端接管 FG 数据所有权（数据收集模式）。默认 0。
Claim=0
; SlotPolicy / SlotWaitUs / StreamAlign / TestSize
;   槽位分配策略、等槽位的超时(微秒)、流对齐、测试用尺寸。默认 0 / 2000 / 1 / 0。
SlotPolicy=0
SlotWaitUs=2000
StreamAlign=1
TestSize=0
