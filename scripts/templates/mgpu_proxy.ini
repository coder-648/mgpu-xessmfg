; ===========================================================================
;  mgpu_proxy.ini - version.dll proxy (游戏目录)
;  version.dll 用它决定"只做 arch 伪装"还是"连宿主一起起来"。
;  改完需要【重启游戏】。注释行以 ; 开头。
; ===========================================================================
[proxy]

; ArchSpoof  1 = 把 GPU 架构号伪装成 Ada（0x190），sl.common 的 slInit 会检查这个值；0 = 不伪装。
ArchSpoof=1
; MinArchPatch  1 = 同时放宽 Streamline 运行时的最低架构检查；0 = 不管。
MinArchPatch=1
; Host  1 = 加载宿主（mgpu_capture_host：设备/队列/交换链包装 + 加载 mgpu_capture.dll）；
;       0 = 只做最小 proxy（arch 伪装），不采集。**必须是 1 才会有采集日志。**
Host=1

; ---------------------------------------------------------------------------
; 命令表 / 提交路径（实验用，正常保持下面这组值）
; ---------------------------------------------------------------------------
; RecordList  1 = 把"我们自己的 DIRECT 命令表"追加到游戏的提交里。
;             实测第 2 次提交必崩 CP2077，保持 0。
RecordList=0
; PublishWait  1 = 让游戏队列等待拷贝完成后再发布（顺序最稳）；
;              0 = 不等待（可能读到未拷完的槽位，仅压力测试用）。
PublishWait=1

; ---------------------------------------------------------------------------
; 其它已知开关（默认值即推荐值）
; ---------------------------------------------------------------------------
; PresentHook  0 = 不挂 Present；默认 1。
; PresentHook=1
; SwapchainWrap  0 = 不包装交换链；默认 1。
; SwapchainWrap=1
; 命令表一律不包装（代码里固定行为，无开关）：我们的包装只到 list9，UE5 等游戏持有
; 更新的接口（list7/list10 + 增强屏障），包装后会在 ExecuteCommandLists 里崩 0xC0000005。
; RawVtableHooks  0 = 只做 IID 包装，不直接改 raw vtable；默认 1。
; RawVtableHooks=1
; NoWrap  1 = 只挂函数、不包装设备/队列对象（对照实验用）；默认 0。
; NoWrap=0
; HookDlssgInstances  1 = 挂钩 dlssg 实例创建；默认 0。
; HookDlssgInstances=0
